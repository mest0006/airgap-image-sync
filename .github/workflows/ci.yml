name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  end-to-end:
    name: Real transfer with skopeo (resolve, export, manifest, verify, import)
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Resolve a small image list to digests
        run: |
          printf 'busybox:1.36\nalpine:3.20\n' > images.txt
          python -m airgap_sync resolve images.txt -o images.lock.json
          cat images.lock.json
      - name: Export onto "transfer media"
        run: python -m airgap_sync plan-export images.lock.json --media media | bash -ex
      - name: Write and verify the manifest
        run: |
          python -m airgap_sync manifest media
          python -m airgap_sync verify media
      - name: Tampering is detected
        run: |
          f=$(find media -type f -path '*blobs*' | head -1)
          cp "$f" /tmp/orig && echo x >> "$f"
          if python -m airgap_sync verify media; then echo "tampering not detected"; exit 1; fi
          cp /tmp/orig "$f"
      - name: Import into the internal registry by digest
        run: |
          python -m airgap_sync plan-import images.lock.json --media media --registry localhost:5000 \
            | sed 's/skopeo copy/skopeo copy --dest-tls-verify=false/' | bash -ex
      - name: Digest inside matches the lockfile
        run: |
          want=$(python -c "import json;print([e['digest'] for e in json.load(open('images.lock.json')) if e['repository'].endswith('/busybox')][0])")
          got="sha256:$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/library/busybox:1.36 | sha256sum | cut -d' ' -f1)"
          echo "want=$want got=$got"
          test "$want" = "$got"
